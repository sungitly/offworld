<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<title>WineTalk_From_Sweetness_to_Time_V1</title>
<style>
:root{color-scheme:dark;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;--canvas:#111210;--bar:#191a18;--surface:#252622;--ink:#eeeae1;--muted:#999b93;--line:#30322d;--focus:#edb675;--clear:transparent;background:var(--canvas);color:var(--ink)}
*{box-sizing:border-box}body{margin:0}main{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto}
.stage{display:flex;align-items:center;justify-content:center;min-height:0;padding:12px}img{display:block;max-width:100%;max-height:100%;object-fit:contain}
footer{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:24px;min-height:72px;padding:12px 24px;background:var(--bar);border-top:1px solid var(--line)}
.deck-info{display:flex;align-items:center;gap:20px;min-width:0}.home-link{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;white-space:nowrap;font-size:12px;border-radius:6px}.home-link svg{width:16px;height:16px}
h1{font-size:12px;font-weight:400;margin:0;max-width:32ch;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;color:var(--muted)}
button,input{font:inherit;color:inherit}button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:50%;width:44px;height:44px;padding:0;background:var(--clear);cursor:pointer;white-space:nowrap;flex-shrink:0}button svg{display:block;width:20px;height:20px;pointer-events:none}button:disabled{opacity:.25;cursor:default}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.controls{display:flex;align-items:center;gap:4px}.controls nav{display:flex;align-items:center;gap:4px}.page-indicator{display:flex;align-items:center;height:24px;gap:8px;margin-left:12px;padding-left:20px;border-left:1px solid var(--line);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}.page-indicator input{width:44px;height:44px;border:0;border-radius:4px;padding:0;background:var(--clear);color:var(--ink);text-align:center;font-size:13px;appearance:textfield;-moz-appearance:textfield}.page-indicator input::-webkit-inner-spin-button,.page-indicator input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#play{width:44px;height:44px;min-width:44px;margin-inline:4px;background:var(--ink);color:var(--canvas)}#play svg{stroke:none;fill:currentColor;width:18px;height:18px}.icon-pause,.icon-replay{display:none}#play[data-state=pause] .icon-play,#play[data-state=replay] .icon-play{display:none}#play[data-state=pause] .icon-pause,#play[data-state=replay] .icon-replay{display:block}#play .icon-replay{stroke:currentColor;fill:none;stroke-width:1.8}
.utilities{display:flex;align-items:center;justify-content:flex-end;gap:8px}.speed-button{width:auto;gap:6px;padding:0 10px;border-radius:8px;color:var(--muted);font-size:12px}.speed-button svg{width:12px;height:12px}.utilities #full{color:var(--muted)}
.speed-menu{display:none;position:fixed;inset:auto;margin:0;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bar);color:var(--ink);box-shadow:0 12px 36px #0006}.speed-menu:popover-open{display:block}.speed-menu p{margin:0 0 12px;font-size:11px;color:var(--muted)}.speed-options{display:flex;gap:4px}.speed-options button{width:58px;height:44px;border-radius:6px;font-size:12px;color:var(--muted)}.speed-options button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
@media(hover:hover){button:hover:not(:disabled){background:var(--surface);color:var(--ink)}#play:hover:not(:disabled){background:var(--ink);color:var(--canvas);opacity:.85}.home-link:hover{color:var(--ink)}.page-indicator input:hover{background:var(--surface)}}button:active:not(:disabled){transform:translateY(1px)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:900px){footer{gap:16px;padding-inline:16px}h1{max-width:18ch}.deck-info{gap:12px}}
@media(max-width:600px){footer{grid-template-columns:minmax(0,1fr) auto;gap:0 12px;padding:4px 12px 8px}.deck-info{grid-column:1;grid-row:1}.utilities{grid-column:2;grid-row:1;gap:0}.controls{grid-column:1/-1;grid-row:2;justify-self:center}.stage{padding:0}h1{max-width:20ch;font-size:11px}.page-indicator{margin-left:8px;padding-left:16px}}
@media(max-width:380px){h1{display:none}.deck-info{gap:0}}
@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
<main>
 <div class="stage" aria-label="幻灯片"><img id="slide" src="images/001.jpg" alt="第 1 页"></div>
 <footer>
  <div class="deck-info"><a class="home-link" href="/" aria-label="返回首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg><span>首页</span></a><h1 title="WineTalk_From_Sweetness_to_Time_V1">WineTalk_From_Sweetness_to_Time_V1</h1></div>
  <div class="controls">
   <nav aria-label="翻页">
    <button id="prev" type="button" aria-label="上一页" title="上一页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    <button id="play" type="button" data-state="play" aria-label="自动播放" aria-pressed="false" title="自动播放"><svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.5v15l12-7.5z"/></svg><svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg><svg class="icon-replay" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button>
    <button id="next" type="button" aria-label="下一页" title="下一页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
   </nav>
   <div class="page-indicator"><label class="sr-only" for="page">跳转页码</label><input id="page" type="number" min="1" max="7" value="1" title="输入页码跳转"><span aria-hidden="true">/</span><span aria-hidden="true">7</span></div>
  </div>
  <div class="utilities"><input id="interval" type="hidden" value="4"><button id="speed" class="speed-button" type="button" popovertarget="speed-menu" aria-label="自动播放间隔：4 秒" title="自动播放间隔"><span id="speed-label">4 秒</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button><button id="full" type="button" aria-label="全屏" title="全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
  <span id="status" class="sr-only" role="status" aria-live="polite"></span>
 </footer>
</main>
<div id="speed-menu" class="speed-menu" popover><p>自动翻页间隔</p><div class="speed-options" role="group" aria-label="自动播放间隔"><button type="button" data-interval="3" aria-pressed="false">3 秒</button><button type="button" data-interval="4" aria-pressed="true">4 秒</button><button type="button" data-interval="5" aria-pressed="false">5 秒</button></div></div>
<noscript><p>启用 JavaScript 后可翻页。以下为所有页面：</p><img src="images/001.jpg" alt="第 1 页" style="width:100%"><img src="images/002.jpg" alt="第 2 页" style="width:100%"><img src="images/003.jpg" alt="第 3 页" style="width:100%"><img src="images/004.jpg" alt="第 4 页" style="width:100%"><img src="images/005.jpg" alt="第 5 页" style="width:100%"><img src="images/006.jpg" alt="第 6 页" style="width:100%"><img src="images/007.jpg" alt="第 7 页" style="width:100%"></noscript>
<script>
const count=7, image=document.querySelector('#slide'), input=document.querySelector('#page');
const play=document.querySelector('#play'), interval=document.querySelector('#interval'), status=document.querySelector('#status');
let current=1, playing=false, timer;
function updatePlayButton(){
 const state=playing?'pause':current===count?'replay':'play',label=playing?'暂停播放':current===count?'重新播放':'自动播放';
 play.dataset.state=state;play.setAttribute('aria-label',label);play.title=label;play.setAttribute('aria-pressed',String(playing));
}
function pause(message=''){
 clearTimeout(timer);playing=false;updatePlayButton();
 if(message)status.textContent=message;
}
function schedule(){
 clearTimeout(timer);
 if(!playing||document.hidden)return;
 if(current===count){pause('已播放到最后一页。');return;}
 if(image.complete&&image.naturalWidth>0)timer=setTimeout(()=>show(current+1),Number(interval.value)*1000);
}
function show(n,updateHash=true){
 current=Math.min(count,Math.max(1,Number.isFinite(n)?Math.trunc(n):1));
 image.src=`images/${String(current).padStart(3,'0')}.jpg`;image.alt=`第 ${current} 页，共 ${count} 页`;
 input.value=current;document.querySelector('#prev').disabled=current===1;document.querySelector('#next').disabled=current===count;
 status.textContent=image.alt;play.disabled=count<2;
 if(updateHash)history.replaceState(null,'',`#${current}`);
 if(current<count){const preload=new Image();preload.src=`images/${String(current+1).padStart(3,'0')}.jpg`}
 if(playing)schedule();else updatePlayButton();
}
function navigate(n){pause();show(n);}
function togglePlay(){
 if(playing){pause('自动播放已暂停。');return;}
 if(current===count)show(1);
 playing=true;updatePlayButton();
 status.textContent=`自动播放，每 ${interval.value} 秒翻页。`;schedule();
}
play.onclick=togglePlay;
interval.onchange=()=>{if(playing){status.textContent=`自动播放，每 ${interval.value} 秒翻页。`;schedule();}};
const speed=document.querySelector('#speed'), speedMenu=document.querySelector('#speed-menu');
function positionSpeedMenu(){const rect=speed.getBoundingClientRect();speedMenu.style.left=`${Math.max(12,Math.min(innerWidth-speedMenu.offsetWidth-12,rect.right-speedMenu.offsetWidth))}px`;speedMenu.style.bottom=`${innerHeight-rect.top+8}px`;}
speedMenu.addEventListener('toggle',e=>{if(e.newState==='open')positionSpeedMenu();});
addEventListener('resize',()=>{if(speedMenu.matches(':popover-open'))positionSpeedMenu();});
document.querySelectorAll('[data-interval]').forEach(option=>option.onclick=()=>{interval.value=option.dataset.interval;document.querySelector('#speed-label').textContent=`${interval.value} 秒`;speed.setAttribute('aria-label',`自动播放间隔：${interval.value} 秒`);document.querySelectorAll('[data-interval]').forEach(button=>button.setAttribute('aria-pressed',String(button===option)));interval.dispatchEvent(new Event('change'));speedMenu.hidePopover();speed.focus({preventScroll:true});});
image.addEventListener('load',schedule);
image.addEventListener('error',()=>pause('当前页面加载失败，请检查网络或手动翻页。'));
document.querySelector('#prev').onclick=()=>navigate(current-1);
document.querySelector('#next').onclick=()=>navigate(current+1);
input.onfocus=()=>pause();input.onchange=()=>navigate(Number(input.value));
document.querySelector('.home-link').onclick=()=>pause();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause('切换标签页后，自动播放已暂停。');});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&playing){pause('自动播放已暂停。');return;}
 if(e.target.closest('input,textarea,select,button,a')||e.ctrlKey||e.metaKey||e.altKey)return;
 const actions={ArrowRight:current+1,ArrowDown:current+1,PageDown:current+1,' ':current+1,ArrowLeft:current-1,ArrowUp:current-1,PageUp:current-1,Home:1,End:count};
 if(e.key in actions){e.preventDefault();navigate(actions[e.key]);}
});
const full=document.querySelector('#full');
if(!document.fullscreenEnabled)full.hidden=true;
full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{status.textContent='浏览器未允许全屏';}};
document.addEventListener('fullscreenchange',()=>{const label=document.fullscreenElement?'退出全屏':'全屏';full.setAttribute('aria-label',label);full.title=label;});
let startX=0,startY=0,touchStarted=false;
image.addEventListener('touchstart',e=>{touchStarted=e.touches.length===1;if(touchStarted){startX=e.touches[0].clientX;startY=e.touches[0].clientY;}},{passive:true});
image.addEventListener('touchend',e=>{if(!touchStarted||!e.changedTouches.length)return;touchStarted=false;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*2)navigate(current+(dx<0?1:-1));},{passive:true});
addEventListener('hashchange',()=>{pause();show(Number(location.hash.slice(1)),false);});
show(Number(location.hash.slice(1))||1,false);
</script>
</html>
